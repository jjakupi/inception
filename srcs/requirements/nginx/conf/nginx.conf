server {
	listen 443 ssl;
	server_name jjakupi.42.fr;

	ssl_certificate     /etc/nginx/ssl/jjakupi.42.fr.crt;
	ssl_certificate_key /etc/nginx/ssl/jjakupi.42.fr.key;

	ssl_protocols TLSv1.2 TLSv1.3;

	root /var/www/html;
	index index.php;

	location /
	{
		try_files $uri $uri/ = 404;
	}

	location ~ \.php$
	{
		include snippets/fastcgi-php.conf;
		fastcgi_pass wordpress:9000;
	}
}
