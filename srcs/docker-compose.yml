services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb
    container_name: mariadb
    env_file:
      - .env
    restart: always
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception

  wordpress:
    build: ./requirements/wordpress
    image: wordpress
    container_name: wordpress
    env_file:
      - .env
    restart: always
    depends_on:
      - mariadb
    networks:
      - inception

volumes:
  mariadb_data:
    driver_opts:
      type: none
      o: bind
      device: /home/jjakupi/data/mariadb

networks:
  inception:
