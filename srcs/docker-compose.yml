services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb
    container_name: mariadb
    env_file:
      - .env
    restart: always
    volumes:
      - mariadb_data:/var/lib/mysql
  
volumes:
  mariadb_data:
    driver_opts: #forces docker to store data on host machine
      type: none # just use a normal folder
      o: bind #“bind (link) container folder to a host folder”
      device: /home/jjakupi/data/mariadb #“This is the real folder on my machine”
